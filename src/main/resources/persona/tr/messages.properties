# User-facing fixed texts (AD-18). Read as UTF-8.
# Texts used with arguments go through java.text.MessageFormat: write an apostrophe as '' there.
llm.unavailable=Efendim, şu an Claude'a ulaşamıyorum, bu yüzden hiçbir işlem yapmadım. Bağlantı ya da API anahtarı düzelince tekrar deneyebiliriz.
llm.rejected=Efendim, isteğinizi Claude'a iletemedim ve hiçbir işlem yapmadım. Konuşma çok uzadıysa "yeni konuşma" yazarak temiz bir sayfa açabiliriz; değilse bu benim tarafımda bir hata.
agent.failed=Efendim, beklenmedik bir hata oldu ve isteğinizi tamamlayamadım. Hiçbir işlem yapmadım.
agent.busy=Efendim, şu an başka bir iş üzerindeyim. Önce onu bitirmemi bekleyebilir ya da durdurmamı isteyebilirsiniz.
agent.message-blank=Efendim, boş bir mesaj aldım; ne istediğinizi yazar mısınız?
agent.message-too-long=Efendim, bu mesaj çok uzun; en fazla {0,number,#} karakter alabiliyorum. Kısaltabilir misiniz?
llm.budget-exhausted=Efendim, bu ayın Claude bütçesi doldu ya da kalanı bir isteğe yetmiyor, bu yüzden yeni bir iş başlatmadım. Bütçe yeni ayda yenilenir; isterseniz aylık bütçe ayarını yükseltebilirsiniz.
llm.budget-exhausted-mid-task=Efendim, bu işin ortasında aylık Claude bütçesi bir sonraki adıma yetmedi ve durdum. Şimdiye kadarki adımlar tamamlandı, ama sonuca varamadım; sistemde başka bir değişiklik yapmadım. Bütçe yeni ayda yenilenir ya da aylık bütçe ayarını yükseltebilirsiniz.
llm.turn-limit=Efendim, bu iş için ayrılan {0,number,#} adım sınırına ulaştım ve durdum. Sonuca varamadım; sistemde başka bir değişiklik yapmadım. İsterseniz isteği daraltıp yeniden deneyebiliriz.
llm.budget-warning=Bu arada efendim, bu ayın Claude bütçesinin büyük kısmını kullandık; dolmak üzere.
# The "new conversation" command (FR-5): accepted forms separated by |, matched exactly; case, surrounding spaces and a
# trailing . or ! are ignored. It never reaches Claude.
command.new-conversation=yeni konuşma|yeni konusma
conversation.reset=Peki efendim, yeni bir konuşmaya başladık; öncekileri artık hatırlamıyorum.
conversation.suggest-reset=Bu arada efendim, konuşmamız epey uzadı; konu değiştiyse "yeni konuşma" yazarak temiz bir sayfa açabiliriz, hem daha hızlı hem daha ucuz olur.
conversation.context-full=Efendim, konuşmamız Claude'un hafızasına sığmayacak kadar uzadı, bu yüzden bu isteği tamamlayamadım ve hiçbir işlem yapmadım. "yeni konuşma" yazarsanız temiz bir sayfayla devam edebiliriz.
