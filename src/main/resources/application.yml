server:
  # Never reachable from the network (AD-10); every /api request also needs the daemon token.
  address: 127.0.0.1
  # 0 = a free port per start; the thin client finds it in the runtime file.
  port: ${alfred.cli.port}

spring:
  application:
    name: alfred
  mvc:
    # Malformed requests (bad JSON, wrong content type) also answer with RFC 9457 ProblemDetail.
    problemdetails:
      enabled: true
  datasource:
    url: ${ALFRED_DB_URL:jdbc:postgresql://127.0.0.1:5432/${ALFRED_DB_NAME:alfred}}
    username: ${ALFRED_DB_USER:alfred}
    password: ${ALFRED_DB_PASSWORD}
  modulith:
    runtime:
      # Flyway per application module: db/migration/__root, then db/migration/<module>.
      flyway-enabled: true
    events:
      jdbc:
        # event_publication lives in the shared modulith schema, created by Flyway (not schema-initialization).
        schema: modulith
        schema-initialization:
          enabled: false

alfred:
  cli:
    port: 0
    # Empty: ALFRED_RUNTIME_DIR, else $XDG_RUNTIME_DIR/alfred, else %LOCALAPPDATA%/alfred, else ~/.local/state/alfred.
    runtime-dir:
  agent:
    max-active-tasks: 1
    # Longer messages are refused before any Claude call (cost guard until the budget of Story 1.5).
    max-message-chars: 20000
  persona:
    language: tr
  llm:
    model: claude-haiku-5-5
    effort: medium
    max-tokens: 16000
    # From the environment only (AD-15); empty means every call fails with LlmUnavailable.
    api-key: ${ANTHROPIC_API_KEY:}
    base-url:
    max-retries: 2
    timeout: 60s
    max-tool-result-chars: 20000
    # Budget and Turn limit, checked before every call (AD-12, FR-18).
    monthly-budget-usd: 5
    max-turns-per-task: 15
    budget-warning-ratio: 0.8
    # The budget month follows this calendar.
    budget-zone: Europe/Istanbul
    # claude-haiku-5-5, USD per million tokens; prompts over the threshold use the long rates.
    pricing:
      input-per-mtok: 0.10
      output-per-mtok: 0.50
      long-input-per-mtok: 0.50
      long-output-per-mtok: 2.50
      long-context-threshold: 100000
      cache-read-multiplier: 0.1
      cache-write-multiplier: 1.25
