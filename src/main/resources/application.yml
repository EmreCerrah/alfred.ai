server:
  # Never reachable from the network (AD-10); Story 1.3 adds token and Origin/Host checks.
  address: 127.0.0.1

spring:
  application:
    name: alfred
  datasource:
    url: ${ALFRED_DB_URL:jdbc:postgresql://127.0.0.1:5432/${ALFRED_DB_NAME:alfred}}
    username: ${ALFRED_DB_USER:alfred}
    password: ${ALFRED_DB_PASSWORD}
  ai:
    model:
      # Story 1.2 enables the Anthropic chat model behind LlmPort.
      chat: none
  modulith:
    runtime:
      # Flyway per application module: db/migration/__root, then db/migration/<module>.
      flyway-enabled: true
    events:
      jdbc:
        # event_publication lives in the shared modulith schema, created by Flyway (not schema-initialization).
        schema: modulith
        schema-initialization:
          enabled: false
