# Dependencies only; the alfred daemon itself runs on the host.
# Fixed project name: alfred's own containers and volumes are protected resources (AD-20).
name: alfred

services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_DB: ${ALFRED_DB_NAME:-alfred}
      POSTGRES_USER: ${ALFRED_DB_USER:-alfred}
      POSTGRES_PASSWORD: ${ALFRED_DB_PASSWORD:?set ALFRED_DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
